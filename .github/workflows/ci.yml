name: biotech-platform

on:
  push:
    paths:
      - "biotech-platform/**"
  pull_request:
    paths:
      - "biotech-platform/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
      working-directory: biotech-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: biotech-platform/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests infra worker.py seed.py
      - run: pytest -q
      - run: python -m playwright install --with-deps chromium
      - name: Run app for browser smoke test
        run: |
          APP_ENV=test DEV_AUTH=true DATABASE_URL=sqlite:////tmp/biotech-browser.sqlite3 uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
          RUN_BROWSER_TESTS=1 APP_BASE_URL=http://127.0.0.1:8000 pytest -q tests/test_browser.py
